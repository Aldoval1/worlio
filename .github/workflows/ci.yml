name: Universo RTS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validar Tipos, Tests y Compilación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificación Estricta de Tipos (TypeScript)
        run: pnpm run check

      - name: Ejecutar Suite de Tests Unitarios
        run: pnpm run test

      - name: Compilación Completa de Producción
        run: pnpm run build
